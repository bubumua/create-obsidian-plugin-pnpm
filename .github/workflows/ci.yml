name: Check scaffolder
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack
      - run: node bin/index.mjs .smoke --yes --id smoke-notes --author "Template test"
      - run: pnpm --dir .smoke install --frozen-lockfile
      - run: pnpm --dir .smoke check
